name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # Use stable pre-installed Android SDK on ubuntu-latest runner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/[0-9]* | sort -V | tail -n 1)
          PLATFORM_DIR=$(ls -d $ANDROID_HOME/platforms/android-[0-9]* | grep -E 'android-[0-9]+$' | sort -V | tail -n 1)
          echo "Found build-tools: $BUILD_TOOLS_DIR"
          echo "Found platform: $PLATFORM_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> $GITHUB_ENV
          echo "TARGET_SDK=34" >> $GITHUB_ENV

      - name: Resolve version from the manifest (single source of truth)
        run: |
          VERSION_CODE=$(grep -o 'android:versionCode="[0-9]*"' android/AndroidManifest.xml | head -n 1 | grep -o '[0-9]\+')
          VERSION_NAME=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml | head -n 1)
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionCode/versionName from android/AndroidManifest.xml"
            exit 1
          fi
          echo "Building version $VERSION_NAME (versionCode $VERSION_CODE)"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Fail when the tag does not match the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${VERSION_NAME}."
            echo "::error::Bump android/AndroidManifest.xml to ${TAG_VERSION} (versionCode > previous), commit, then tag that commit."
            exit 1
          fi

      - name: Setup Official Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Official release keystore found in GitHub Secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > $HOME/release.keystore
            echo "KEYSTORE=$HOME/release.keystore" >> $GITHUB_ENV
            echo "KS_ALIAS=${KEY_ALIAS:-release}" >> $GITHUB_ENV
            echo "KS_PASS=${KEYSTORE_PASS}" >> $GITHUB_ENV
          else
            echo "No custom keystore secret provided. Falling back to default debug keystore."
          fi

      - name: Verify SystemPrompt Parity
        run: |
          python3 tools/gen_java_prompt.py --check

      - name: Build Android APK
        run: |
          chmod +x tools/build_apk.sh
          ./tools/build_apk.sh

      - name: Verify APK Alignment
        run: |
          python3 tools/check_apk_alignment.py android/build/com.promptengine.app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptEngine-${{ env.VERSION_NAME }}
          path: android/build/com.promptengine.app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Prompt Engine Android ${{ github.ref_name }}"
          body: |
            ## 📱 انتشار نسخه جدید اپلیکیشن اندروید (${{ github.ref_name }})

            - **نسخه (Version Name):** `${{ env.VERSION_NAME }}`
            - **کد نسخه (Version Code):** `${{ env.VERSION_CODE }}`
            - **امضا:** امضاشده با کلید دیجیتال انتشار اختصاصی (`CN=AndroidHarness Release, O=adel107107ai`)
            - نسخه از `android/AndroidManifest.xml` خوانده می‌شود؛ برای انتشار نسخهٔ بعدی فقط مانیفست را بامپ کن و تگ را روی همان کامیت بزن.
          files: android/build/com.promptengine.app.apk
          draft: false
          prerelease: false
