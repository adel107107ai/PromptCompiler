name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # Use stable pre-installed Android SDK on ubuntu-latest runner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/[0-9]* | sort -V | tail -n 1)
          PLATFORM_DIR=$(ls -d $ANDROID_HOME/platforms/android-[0-9]* | grep -E 'android-[0-9]+$' | sort -V | tail -n 1)
          echo "Found build-tools: $BUILD_TOOLS_DIR"
          echo "Found platform: $PLATFORM_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> $GITHUB_ENV
          echo "TARGET_SDK=34" >> $GITHUB_ENV
          echo "VERSION_CODE=6" >> $GITHUB_ENV
          echo "VERSION_NAME=1.3.1" >> $GITHUB_ENV

      - name: Setup Official Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Official release keystore found in GitHub Secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > $HOME/release.keystore
            echo "KEYSTORE=$HOME/release.keystore" >> $GITHUB_ENV
            echo "KS_ALIAS=${KEY_ALIAS:-release}" >> $GITHUB_ENV
            echo "KS_PASS=${KEYSTORE_PASS}" >> $GITHUB_ENV
          else
            echo "No custom keystore secret provided. Falling back to default debug keystore."
          fi

      - name: Verify SystemPrompt Parity
        run: |
          python3 tools/gen_java_prompt.py --check

      - name: Build Android APK
        run: |
          chmod +x tools/build_apk.sh
          ./tools/build_apk.sh

      - name: Verify APK Alignment
        run: |
          python3 tools/check_apk_alignment.py android/build/com.promptengine.app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptEngine-v1.3.1
          path: android/build/com.promptengine.app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Prompt Engine Android ${{ github.ref_name }}"
          body: |
            ## 📱 انتشار نسخه جدید اپلیکیشن اندروید (${{ github.ref_name }})

            - **نسخه (Version Name):** `1.3.1`
            - **کد نسخه (Version Code):** `6`
            - **امضا:** امضاشده با کلید دیجیتال انتشار اختصاصی (`CN=AndroidHarness Release, O=adel107107ai`)
            - **تغییرات:**
              - مصاحبهٔ شفاف‌سازی: تحلیل درخواست، پرسش‌های هدفمند (حداکثر ۴ سؤال)، و تزریق پاسخ‌ها به‌عنوان الزامات صریح
              - بهبود پایداری استریم پاسخ‌ها
              - بهینه‌سازی تراز و حجم فایل بسته نهایی
          files: android/build/com.promptengine.app.apk
          draft: false
          prerelease: false
