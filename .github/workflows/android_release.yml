name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # Use stable pre-installed Android SDK on ubuntu-latest runner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/[0-9]* | sort -V | tail -n 1)
          PLATFORM_DIR=$(ls -d $ANDROID_HOME/platforms/android-[0-9]* | grep -E 'android-[0-9]+$' | sort -V | tail -n 1)
          echo "Found build-tools: $BUILD_TOOLS_DIR"
          echo "Found platform: $PLATFORM_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> $GITHUB_ENV
          echo "TARGET_SDK=34" >> $GITHUB_ENV
          echo "VERSION_CODE=5" >> $GITHUB_ENV
          echo "VERSION_NAME=1.3.0" >> $GITHUB_ENV

      - name: Verify SystemPrompt Parity
        run: |
          python3 tools/gen_java_prompt.py --check

      - name: Build Android APK
        run: |
          chmod +x tools/build_apk.sh
          ./tools/build_apk.sh

      - name: Verify APK Alignment
        run: |
          python3 tools/check_apk_alignment.py android/build/com.promptengine.app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptEngine-v1.3.0
          path: android/build/com.promptengine.app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Prompt Engine Android ${{ github.ref_name }}"
          body: |
            ## 📱 انتشار نسخه جدید اپلیکیشن اندروید (${{ github.ref_name }})

            - **نسخه (Version Name):** `1.3.0`
            - **کد نسخه (Version Code):** `5`
            - **تغییرات:**
              - ارتقای موتور پرامپت و همگام‌سازی منطق کامپایلر
              - بهبود پایداری استریم پاسخ‌ها
              - بهینه‌سازی تراز و حجم فایل بسته نهایی
          files: android/build/com.promptengine.app.apk
          draft: false
          prerelease: false
